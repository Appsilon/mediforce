name: Build & Push Docker Images

# A push to main builds `:latest`, which staging runs. A release build, called by
# release.yml or started by hand with a version, builds `:<version>` instead,
# which production pins. Every build is also tagged with its commit SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag the images with, e.g. 1.4.0. Run from its vX.Y.Z tag. Empty builds :latest.'
        type: string
        required: false
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true

# Main builds cancel each other; a release build is never cancelled. A release
# build only reads the layer cache: release.yml calls it from a merged PR's
# `closed` event, which can't write the cache ('failed to reserve cache').
concurrency:
  group: build-images-${{ inputs.version || 'latest' }}
  cancel-in-progress: ${{ !inputs.version }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/appsilon/mediforce
  SHA: ${{ inputs.sha || github.sha }}
  RELEASE_TAG: ${{ inputs.version || 'latest' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      # A manual release build must run from its tag, or `:<version>` would
      # point at whatever commit the Actions UI had selected.
      - name: Release build runs from its tag
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::Run this build from the v$VERSION tag, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitise platform slug
        run: echo "PLATFORM_SLUG=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Build & push platform-ui (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/platform-ui/Dockerfile
          target: runner
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-platform-ui:${{ env.SHA }}-${{ env.PLATFORM_SLUG }}
          cache-from: type=gha,scope=platform-ui-${{ env.PLATFORM_SLUG }}
          cache-to: ${{ !inputs.version && format('type=gha,mode=max,scope=platform-ui-{0}', env.PLATFORM_SLUG) || '' }}

      - name: Build & push migrate (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/platform-ui/Dockerfile
          target: migrate
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-migrate:${{ env.SHA }}-${{ env.PLATFORM_SLUG }}
          cache-from: type=gha,scope=migrate-${{ env.PLATFORM_SLUG }}
          cache-to: ${{ !inputs.version && format('type=gha,mode=max,scope=migrate-{0}', env.PLATFORM_SLUG) || '' }}

      - name: Build & push container-worker (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/container-worker/Dockerfile.worker
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-container-worker:${{ env.SHA }}-${{ env.PLATFORM_SLUG }}
          cache-from: type=gha,scope=container-worker-${{ env.PLATFORM_SLUG }}
          cache-to: ${{ !inputs.version && format('type=gha,mode=max,scope=container-worker-{0}', env.PLATFORM_SLUG) || '' }}

  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifests
        run: |
          for image in platform-ui migrate container-worker; do
            docker buildx imagetools create \
              --tag "$IMAGE_PREFIX-$image:$RELEASE_TAG" \
              --tag "$IMAGE_PREFIX-$image:$SHA" \
              "$IMAGE_PREFIX-$image:$SHA-linux-amd64" \
              "$IMAGE_PREFIX-$image:$SHA-linux-arm64"
          done
