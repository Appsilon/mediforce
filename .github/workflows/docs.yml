name: Docs

# CI (`ci.yml`) deliberately skips docs-only changes, so documentation checks
# need their own workflow — otherwise the PRs most likely to break a doc link
# are exactly the ones nothing runs on.
on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'agents/**'
      - 'scripts/check_doc_links.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'skills/**'
      - 'agents/**'
      - 'scripts/check_doc_links.py'
      - '.github/workflows/docs.yml'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_doc_links.py
